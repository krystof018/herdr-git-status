# id stays "gitlab-ci-status" for back-compat (keybindings, config dir, plugin link)
# even though the plugin now also supports GitHub.
id = "gitlab-ci-status"
name = "GitLab & GitHub CI + Review Status"
version = "0.4.0"
min_herdr_version = "0.7.0"
description = "GitLab & GitHub CI and merge-request review status in herdr: a live colored dot, MR/PR number, and review-state glyph on each space's label, plus on-demand CI-detail and 'My MRs' panes. Auto-detects the provider from the repo's origin host."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open CI status pane"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[actions]]
id = "start"
title = "Start CI status dots"
command = ["bash", "poller-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Stop CI status dots"
command = ["bash", "poller-ctl.sh", "stop"]

[[actions]]
id = "toggle"
title = "Toggle CI status dots"
command = ["bash", "poller-ctl.sh", "toggle"]

[[actions]]
id = "ensure"
title = "Ensure CI status dots poller is running"
command = ["bash", "poller-ctl.sh", "ensure"]

[[actions]]
id = "open-mr"
title = "Open My MRs pane"
contexts = ["workspace"]
command = ["bash", "open-mr.sh"]

[[panes]]
id = "ci"
title = "CI status"
placement = "split"
command = ["bash", "ci-pane.sh"]

[[panes]]
id = "mr"
title = "My MRs"
placement = "split"
command = ["bash", "mr-pane.sh"]

# NOTE: herdr 0.7 does NOT bind keys declared in a plugin manifest, so there are no
# [[keys.command]] entries here. Bind keys in your ~/.config/herdr/config.toml instead:
#
#   [[keys.command]]
#   key = "prefix+i"
#   type = "shell"
#   command = "herdr plugin action invoke gitlab-ci-status.toggle"
#
#   [[keys.command]]
#   key = "prefix+shift+i"
#   type = "shell"
#   command = "herdr plugin action invoke gitlab-ci-status.open"
#
# Then run: herdr server reload-config
